<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Favole">
<meta name="theme-color" content="#8f7cf0">
<link rel="apple-touch-icon" href="icona.png">
<link rel="icon" href="icona.png">
<title>Favole della Sera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a phone app for little ones and their parents. Pastel bedtime sky (lilac to peach), fluffy cloud edges, cream bubbly cards, a big floating moon mascot, a fixed bottom tab bar. Reader and morning game open full screen. Single committed look: a cuddly pastel storybook app. */
:root{
  color-scheme: light;
  --sky-1:#8f7cf0;   /* lilac top */
  --sky-2:#c3a8ff;   /* soft violet */
  --sky-3:#ffc6d9;   /* pink horizon */
  --paper:#fffaf3;
  --lilac:#f1eaff;
  --ink:#3a2f7a;
  --ink-2:#7a70b3;
  --butter:#ffd66b;
  --butter-d:#f0b93a;
  --pink:#ff9fc8;
  --mint:#86e3c6;
  --peach:#ffbf9e;
  --baby:#a9d8ff;
  --display:"Fredoka", "Trebuchet MS", sans-serif;
  --body:"Nunito", "Segoe UI", sans-serif;
  --shadow:0 12px 30px rgba(74,52,160,.20);
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 45%,var(--sky-3) 100%) fixed;background-color:var(--sky-1);color:var(--ink);font:700 16px/1.45 var(--body);padding-inline:16px;padding-block:10px calc(104px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky i{position:absolute;font-style:normal;color:#fff;opacity:.85;font-size:12px}
.sky .cl{position:absolute;opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .sky i{animation:tw 3s ease-in-out infinite}
  .sky .cl{animation:drift 40s linear infinite}
  .float{animation:float 4s ease-in-out infinite}
  .wiggle{animation:wig 2.8s ease-in-out infinite}
  .blink{animation:blink 5s infinite}
}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes wig{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-3deg) scale(1.03)}93%{transform:rotate(3deg) scale(1.03)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.app{position:relative;z-index:1;max-width:460px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
p{margin:0}
button{font:700 17px var(--display);border:0;border-radius:99px;padding:14px 22px;cursor:pointer;color:var(--ink);background:var(--butter);box-shadow:0 6px 0 var(--butter-d);transition:transform .12s, box-shadow .12s}
button:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 var(--butter-d)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.4}
.soft{background:var(--lilac);box-shadow:0 5px 0 #d8cbff}
.soft:active{box-shadow:0 1px 0 #d8cbff}
.pinkbtn{background:var(--pink);box-shadow:0 6px 0 #e77bab;color:#fff}
.round{width:48px;height:48px;padding:0;display:grid;place-items:center;font-size:20px;background:#fff;box-shadow:0 5px 0 #dcd2ff}

/* header */
.hero{position:relative;display:flex;align-items:center;gap:6px;padding-top:40px}
.hero .moon{width:104px;height:104px;flex:none}
.bubble{position:relative;background:#fff;border-radius:26px;padding:12px 16px;font:700 17px/1.3 var(--display);box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble b{color:#ff6fae}
.mini{font:700 13px var(--body);color:#fff;text-align:center;opacity:.95}

/* story card */
.card{position:relative;background:var(--paper);border-radius:34px;box-shadow:var(--shadow);padding:12px}
.cover{position:relative;border-radius:26px;overflow:hidden}
.cover img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.tagtop{position:absolute;left:12px;top:12px;background:#fff;color:var(--ink);font:700 14px var(--display);padding:7px 13px;border-radius:99px;box-shadow:0 4px 0 #e8e0ff}
.stk{position:absolute;font-size:30px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
.card .in{padding:14px 8px 6px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.card h2{font-size:26px;line-height:1.1}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{font:700 13px var(--display);padding:6px 12px;border-radius:99px;background:var(--lilac);color:var(--ink-2)}
.wbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wb{font:700 14px var(--display);padding:6px 12px;border-radius:14px;transform:rotate(var(--r,0deg));box-shadow:0 3px 0 rgba(58,47,122,.10)}
.c0{background:#ffe9a6;--r:-3deg}.c1{background:#ffd2e6;--r:2deg}.c2{background:#c8f2e4;--r:-1deg}.c3{background:#d4ebff;--r:3deg}.c4{background:#ffdccb;--r:-2deg}.c5{background:#e7dcff;--r:1deg}
.go{width:100%;font-size:21px;padding:17px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:26px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);min-width:0;background:#fff}
.tile .e{font-size:28px;line-height:1}
.tile b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font:800 12px var(--body);color:var(--ink-2)}
.tile.a{background:#fff2c4}.tile.b{background:#ffe1ee}.tile.c{background:#d9f6ec}
.sun{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fff3c2,#ffd7c2);border-radius:28px;padding:14px;box-shadow:var(--shadow)}
.sun .ico{font-size:40px}
.sun div{flex:1;min-width:0}
.sun b{font:700 18px var(--display);display:block}
.sun p{font:700 14px var(--body);color:var(--ink-2)}
.sun button{padding:10px 18px;font-size:16px}
.sec{color:#fff;font-size:24px;text-shadow:0 2px 0 rgba(74,52,160,.25)}
.sub{color:#fff;font:700 14px var(--body);margin-top:-8px;opacity:.95}

/* library */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px 6px;padding-inline:16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;font:700 15px var(--display);padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 4px 0 #dcd2ff;white-space:nowrap}
.cats button[aria-pressed=true]{background:var(--butter);box-shadow:0 4px 0 var(--butter-d)}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.book{position:relative;background:#fff;border-radius:26px;padding:8px 8px 12px;box-shadow:0 7px 0 rgba(74,52,160,.13);text-align:center;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.book:active{box-shadow:0 3px 0 rgba(74,52,160,.13)}
.book img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;display:block}
.book span{font:700 14px/1.2 var(--display);padding-inline:4px}
.book .ok{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:15px;box-shadow:0 3px 0 #5fc7a6}
.book.new{outline:4px dashed #fff;outline-offset:-2px}

/* album */
.prog-album{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.prog-album b{font:700 16px var(--display)}
.track{height:16px;background:var(--lilac);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--butter));border-radius:99px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sticker{aspect-ratio:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font:700 17px var(--display);color:var(--ink);box-shadow:0 5px 0 rgba(58,47,122,.12);transform:rotate(var(--r,0deg))}
.sticker small{font:800 11px var(--body);color:var(--ink-2)}
.sticker.lock{background:rgba(255,255,255,.35);color:rgba(255,255,255,.95);box-shadow:none;border:3px dashed rgba(255,255,255,.7);font-size:26px;transform:none}
.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{40%{transform:scale(1.18) rotate(4deg)}}

/* profile */
.form{background:var(--paper);border-radius:32px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.form label{font:700 15px var(--display);color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.form input,.form select{font:700 19px var(--display);padding:12px 16px;border-radius:20px;border:3px solid #ece4ff;background:#fff;color:var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avatars button{font-size:32px;aspect-ratio:1;padding:0;background:var(--lilac);box-shadow:0 4px 0 #d8cbff;border-radius:22px}
.avatars button[aria-pressed=true]{background:var(--butter);box-shadow:0 4px 0 var(--butter-d)}
.note{font:700 13px var(--body);color:var(--ink-2)}

/* tab bar */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:436px;background:#fff;border-radius:30px;padding:8px;box-shadow:0 10px 30px rgba(74,52,160,.28)}
.tabs button{background:none;box-shadow:none;border-radius:22px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font:700 12px var(--display);color:var(--ink-2)}
.tabs button span{font-size:24px;line-height:1.15;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.tabs button[aria-current=page]{background:var(--lilac);color:var(--ink)}
.tabs button[aria-current=page] span{transform:translateY(-3px) scale(1.2)}

/* layers */
.layer{position:fixed;inset:0;z-index:10;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 55%,var(--sky-3)) fixed;background-color:var(--sky-1)}
.layer.day{background:linear-gradient(180deg,#ffd27e,#ffe7c4 60%,#fff4e0) fixed;background-color:#ffd27e}
.layer .inner{max-width:460px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.path{flex:1;position:relative;height:30px;display:flex;align-items:center}
.path .line{position:absolute;left:8px;right:8px;height:8px;background:rgba(255,255,255,.45);border-radius:99px}
.path .fill{position:absolute;left:8px;height:8px;background:#fff;border-radius:99px;transition:width .4s}
.path .me{position:absolute;font-size:24px;transform:translateX(-50%);transition:left .4s cubic-bezier(.3,1.5,.5,1)}
.frame{position:relative;background:#fff;border-radius:36px;padding:10px;box-shadow:var(--shadow)}
.frame img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;display:block;max-width:100%}
.frame .s1{left:-8px;top:-10px;transform:rotate(-14deg)}.frame .s2{right:-8px;bottom:-12px;transform:rotate(12deg)}
.slide{animation:slide .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes slide{from{opacity:0;transform:translateX(30px) rotate(1deg)}}
.paper{background:var(--paper);border-radius:32px;padding:18px 20px;box-shadow:var(--shadow)}
.txt{font:700 21px/1.6 var(--body);color:var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.magic{min-width:0;margin-left:4px;display:flex;align-items:center;gap:12px;background:#ffe9a6;border-radius:26px;padding:10px 16px;box-shadow:0 6px 0 #f1c95a;text-align:left;transform:rotate(-1.5deg)}
.magic:active{box-shadow:0 2px 0 #f1c95a}
.magic .ico{font-size:30px}
.magic small{display:block;font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#b2861a}
.magic b{font:700 24px/1.1 var(--display)}
.magic em{font:700 15px var(--body);font-style:normal;color:var(--ink-2)}
.listen{width:64px;height:64px;padding:0;border-radius:50%;font-size:26px;background:var(--pink);box-shadow:0 6px 0 #e77bab}
.listen[aria-pressed=true]{background:var(--mint);box-shadow:0 6px 0 #5fc7a6}
.nav{display:grid;grid-template-columns:64px 1fr;gap:10px}
.nav .back{padding:0;background:#fff;box-shadow:0 6px 0 #dcd2ff;font-size:22px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 6px}
.center .moon{width:170px;height:170px}
.center h2{color:#fff;font-size:32px;text-shadow:0 3px 0 rgba(74,52,160,.25)}
.center p{color:#fff;font:700 17px var(--body);max-width:30ch}
.layer.day .center h2,.layer.day .center p{color:var(--ink);text-shadow:none}
.qcard{background:var(--paper);border-radius:28px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.qcard h3{font-size:19px}
.reveal{align-self:flex-start;padding:9px 16px;font-size:15px}
.ans{font:700 17px var(--display);color:#22a07a}
.opts{display:flex;flex-direction:column;gap:12px}
.opts button{text-align:left;background:#fff;box-shadow:0 6px 0 #f1dcc0;font-size:19px;border-radius:24px;padding:16px 20px}
.opts button:disabled{opacity:.55}
.opts button.ok,.opts button.no{opacity:1}
.opts button.ok{background:#c8f2e4;box-shadow:0 6px 0 #86d6bb}
.opts button.no{background:#ffd5df;box-shadow:0 6px 0 #f2a5b8;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.big{font:700 24px/1.35 var(--display)}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.numpad button{padding:14px 0;font-size:24px;background:#fff;box-shadow:0 5px 0 #f1dcc0;border-radius:20px}
.fb{font:700 22px var(--display);text-align:center;min-height:30px}
.starsrow{font-size:46px;letter-spacing:6px}
.zz{position:absolute;font:700 22px var(--display);color:#fff}
@media (prefers-reduced-motion:no-preference){.zz{animation:zz 2.4s ease-in infinite}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-60px) scale(1.2)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg);opacity:.3}}
.sparkle{position:fixed;pointer-events:none;z-index:31;font-size:22px;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.sound{position:absolute;right:0;top:0;font-size:15px;padding:8px 12px;background:rgba(255,255,255,.9);box-shadow:0 4px 0 #dcd2ff}
@media (prefers-reduced-motion:reduce){.pop,.slide,.opts button.no,.confetti i,.sparkle{animation:none}}
.bedcard{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:24px;padding:12px 16px;box-shadow:var(--shadow)}
.bedcard .e{font-size:30px}
.bedcard b{font:700 17px var(--display);display:block}
.bedcard small{font:700 14px var(--body);color:var(--ink-2)}
.book.locked img{filter:saturate(.55) brightness(.97)}
.book .lk,.book .fr{position:absolute;left:12px;top:12px;height:30px;padding:0 10px;border-radius:99px;display:grid;place-items:center;font:700 13px var(--display);box-shadow:0 3px 0 rgba(74,52,160,.18)}
.book .lk{background:#fff;color:var(--ink)}
.book .fr{background:#ffe1ee;color:#c2456a}
.pw{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.pw .pwimg{width:150px;height:150px;border-radius:30px;object-fit:cover;align-self:center;box-shadow:var(--shadow);border:5px solid #fff}
.pw h2{color:#fff;font-size:24px;text-shadow:0 2px 0 rgba(74,52,160,.25)}
.pw .pwsub{color:#fff;font:700 15px var(--body)}
.pw .pwtest{background:#fff3c2;color:#8a5a00;border-radius:14px;padding:6px 10px;font:800 12px var(--body)}
.opt{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;gap:2px 10px;background:#fff;box-shadow:0 6px 0 #dcd2ff;border-radius:24px;padding:16px 18px}
.opt b{font:700 17px var(--display)}
.opt small{grid-column:1;font:700 13px var(--body);color:var(--ink-2)}
.opt em{grid-row:1/3;grid-column:2;font:700 17px var(--display);font-style:normal;color:#7a4be0;white-space:nowrap}
.opt.best{background:linear-gradient(120deg,#fff3c2,#ffe1ee);box-shadow:0 6px 0 var(--butter-d);padding-top:26px}
.opt .badge{position:absolute;left:16px;top:-11px;background:#ff6fae;color:#fff;font:700 12px var(--display);padding:4px 10px;border-radius:99px}
.pwlinks{color:#fff;font:700 13px var(--body)}
.pwlinks a,.form a{color:inherit}
.pwmsg{background:#fff;border-radius:20px;padding:12px;font:700 15px var(--body);color:var(--ink)}
.psec{font-size:18px;margin-top:6px;color:var(--ink)}
.form label.sw{flex-direction:row;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.form label.sw input{width:24px;height:24px;accent-color:#7a4be0;padding:0}
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>
<main class="app" id="app"></main>
<div class="layer" id="layer" hidden><div class="inner" id="lin"></div></div>
<div class="tabs" id="tabs"><nav>
  <button data-tab="home" aria-current="page"><span>🌙</span>Stasera</button>
  <button data-tab="lib"><span>📚</span>Storie</button>
  <button data-tab="words"><span>⭐</span>Adesivi</button>
  <button data-tab="me"><span>🧸</span>Profilo</button>
</nav></div>

<script>
var BOOKS = [];
var AUDW = {};
var BASE = 'libri/';
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'favole-sera-app';
  var st = {name:'Sofia', age:5, avatar:'🐰', story:'ITA', word:'ING', read:[], words:[], nights:[], example:true, game:{}, sound:true};
  try { var raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
  if (!st.langSet){ var nl = ((navigator.languages && navigator.languages[0]) || navigator.language || 'it').slice(0,2).toLowerCase(); st.story = {it:'ITA', en:'ING', es:'SP', fr:'FR'}[nl] || 'ING'; st.word = st.story === 'ING' ? 'SP' : 'ING'; st.langSet = true; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ---------- languages ----------

    $('x').onclick = close;
    $('pic').onclick = function(e){ sparkles(e.clientX, e.clientY); };
    $('w').onclick = function(){ play(wordAud(p.w)); pop($('w')); };
    if ($('ls')) $('ls').onclick = function(){ var btn = $('ls'); if (btn.getAttribute('aria-pressed') === 'true'){ stop(); btn.setAttribute('aria-pressed', 'false'); btn.textContent = '🎧'; return; }
      var a = play(nar, function(){ btn.setAttribute('aria-pressed', 'false'); btn.textContent = '🎧'; }); if (a){ btn.setAttribute('aria-pressed', 'true'); btn.textContent = '⏸'; } };
    $('prev').onclick = function(){ read(b, i-1); };
    $('next').onclick = function(){ read(b, i+1); };
  }

  function end(b){
    var d = V(b), qs = d.quiz.slice(0, 2);
    open('<div class="bar">' + X() + '<span style="font:700 18px var(--display);color:#fff">' + t('theEnd') + ' 🌟</span><span style="width:48px"></span></div>' +
      '<div class="qcard"><h3>💛 ' + t('moral') + '</h3><p>' + esc(d.morale) + '</p></div>' +
      qs.map(function(q, k){ return '<div class="qcard"><h3>💭 ' + t('q', {n:esc(st.name)}) + '</h3><p>' + esc(q.q) + '</p><button class="soft reveal" data-a="' + k + '">' + t('reveal') + '</button><span class="ans" id="a' + k + '" hidden>' + esc(q.o[q.a]) + ' ✓</span></div>'; }).join('') +
      '<div class="qcard"><h3>🎁 ' + t('tStk') + '</h3><div class="wbar">' + d.pagine.map(function(p, i){ return '<button class="wb ' + cIdx(i) + '" data-w="' + i + '" style="border:0;padding:8px 13px">' + esc(p.w) + '</button>'; }).join('') + '</div></div>' +
      '<button id="night" style="font-size:21px;padding:18px">' + t('gn', {n:esc(st.name)}) + ' 🌙</button>');
    $('x').onclick = close;
    document.querySelectorAll('[data-a]').forEach(function(el){ el.onclick = function(){ $('a' + el.dataset.a).hidden = false; el.hidden = true; }; });
    document.querySelectorAll('#lin [data-w]').forEach(function(el){ el.onclick = function(){ play(wordAud(d.pagine[+el.dataset.w].w)); pop(el); }; });
    $('night').onclick = function(){
      var L = LN[st.word].code, before = myWords().length;
      if (st.read.indexOf(b.slug) < 0) st.read.push(b.slug);
      d.pagine.forEach(function(p){ if (!st.words.some(function(w){ return w.w === p.w && w.l === L; })) st.words.push({w:p.w, t:p.t, l:L}); });
      if (st.nights.indexOf(dkey(new Date())) < 0) st.nights.push(dkey(new Date()));
      save(); confetti(); uiVoice('nanna');
      var sk = streak();
      open('<div class="center" style="padding-top:56px"><div style="position:relative">' + moon('sleep', 'float') + '<span class="zz" style="right:6px;top:10px">z</span><span class="zz" style="right:-8px;top:0;animation-delay:.8s">Z</span></div><h2>' + t('sweet', {n:esc(st.name)}) + '</h2><p>' + t('plus', {x:myWords().length - before}) + ' ⭐<br>' + sk + ' ' + (sk === 1 ? t('night1') : t('nightN')) + ' 🔥</p><p>' + t('bfast') + ' ☀️</p><button id="ok">' + t('nanna') + ' 💤</button></div>');
      $('ok').onclick = close;
    };
  }

  function morning(b){
    var d = V(b), items = [];
    d.quiz.forEach(function(q){ items.push({t:'mc', label:t('lStory'), q:q.q, o:q.o, a:q.a}); });
    d.lang.forEach(function(q){ items.push({t:'mc', label:d.lang_h, q:q.q, o:q.o, a:q.a}); });
    d.mate.forEach(function(q){ items.push({t:'num', label:t('lNum'), q:q.q, a:String(q.a).trim()}); });
    var k = 0, score = 0;
    function show(){
      if (k >= items.length){
        var s = score >= 8 ? 3 : score >= 5 ? 2 : score >= 2 ? 1 : 0; st.game[b.slug] = Math.max(st.game[b.slug] || 0, s); save(); if (s >= 2){ confetti(); uiVoice('bravo'); }
        open('<div class="center" style="padding-top:50px"><div style="font-size:100px;line-height:1" class="float">🌞</div><div class="starsrow">' + '⭐'.repeat(s) + '<span style="opacity:.3">' + '⭐'.repeat(3-s) + '</span></div><h2>' + t(s === 3 ? 'g3' : s === 2 ? 'g2' : 'g1') + '</h2><p>' + score + ' ' + (score === 1 ? t('r1') : t('rN')) + ' ' + items.length + '</p><button id="ok">' + t('done') + ' ☀️</button></div>', true);
        $('ok').onclick = close; return;
      }
      var it = items[k];
      var h = '<div class="bar">' + X() + '<span class="pill" style="background:#fff;font-size:14px">' + esc(it.label) + ' · ' + (k+1) + '/' + items.length + '</span><span style="width:48px"></span></div><div class="qcard"><p class="big">' + esc(it.q) + '</p></div>';
      if (it.t === 'mc') h += '<div class="opts">' + it.o.map(function(o, j){ return '<button data-o="' + j + '">' + esc(o) + '</button>'; }).join('') + '</div>';
      else h += '<div class="numpad">' + Array.from({length:20}, function(_, n){ return '<button data-n="' + n + '">' + n + '</button>'; }).join('') + '</div>';
      h += '<p class="fb" id="fb"></p>';
      open(h, true);
      $('x').onclick = close;
      function next(ok){ if (ok){ score++; blip(990, 0.18); } var fb = $('fb'); fb.textContent = ok ? '✨ ' + t('ok') : t('was') + (it.t === 'mc' ? it.o[it.a] : it.a); fb.style.color = ok ? '#22a07a' : '#c2456a'; setTimeout(function(){ k++; show(); }, 1200); }
      if (it.t === 'mc') document.querySelectorAll('[data-o]').forEach(function(el){ el.onclick = function(){ var ok = +el.dataset.o === it.a; document.querySelectorAll('[data-o]').forEach(function(x){ x.disabled = true; if (+x.dataset.o === it.a) x.className = 'ok'; else if (x === el) x.className = 'no'; }); next(ok); }; });
      else document.querySelectorAll('[data-n]').forEach(function(el){ el.onclick = function(){ var ok = el.dataset.n === it.a; document.querySelectorAll('[data-n]').forEach(function(x){ x.disabled = true; }); el.style.background = ok ? '#c8f2e4' : '#ffd5df'; next(ok); }; });
    }
    show();
  }

  function loading(msg){ $('app').innerHTML = '<div class="center" style="padding-top:60px">' + moon('happy', 'float') + '<h2>' + msg + '</h2></div>'; }
  function getJSON(u){ return fetch(u, {cache:'no-cache'}).then(function(r){ if (!r.ok) throw new Error(u); return r.json(); }); }
  var VERSIONE = '81e6a9afac';
  fetch('versione.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(v){
    if (v && v.v && VERSIONE.indexOf('__') < 0 && v.v !== VERSIONE && location.search.indexOf('v=' + v.v) < 0) location.replace(location.pathname + '?v=' + v.v);
  }).catch(function(){});
  loading('🌙 …');
  getJSON('indice.json').then(function(ix){
    GRATIS = ix.gratis || ix.libri.slice(-3);
    return Promise.all(ix.libri.map(function(s){ return getJSON(BASE + s + '/libro_app.json').catch(function(){ return null; }); }));
  }).then(function(list){
    BOOKS = list.filter(function(b){ return b && b.v && Object.keys(b.v).length; });
    BOOKS.forEach(function(b){ Object.keys(b.v).forEach(function(k){ var c = LN[k.split('_')[1]]; if (!c) return; b.v[k].pagine.forEach(function(p, i){ var key = c.code + '|' + p.w; if (!AUDW[key]) AUDW[key] = BASE + b.slug + '/parole/' + c.code + '_' + (i+1) + '.m4a'; }); }); });
    if (!BOOKS.length){ loading('Nessuna storia ancora 🌙'); return; }
    if (!LN[st.story]) st.story = 'ITA'; if (!LN[st.word] || st.word === st.story) st.word = st.story === 'ING' ? 'ITA' : 'ING';
    draw(); if (!st.guida) guide(0);
  }).catch(function(){ loading('Non riesco a caricare le storie. Controlla la connessione 🌙'); });
})();
</script>

</body>
